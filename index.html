<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>北京时间</title>
  <style>
    :root {
      color: #080808;
      background: transparent;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 20px; }
    .clock { width: min(100%, 900px); container-type: inline-size; text-align: center; }
    .clock-time {
      display: block;
      margin: 0;
      color: #080808;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(20px, 15.5cqw, 124px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: .035em;
      line-height: 1.15;
      text-indent: .035em;
      white-space: nowrap;
    }
    .clock-date {
      margin: clamp(12px, 4cqw, 28px) 0 0;
      color: #646464;
      font-size: clamp(11px, 3.7cqw, 24px);
      font-weight: 400;
      line-height: 1.5;
      white-space: nowrap;
    }
    @media (max-width: 240px), (max-height: 130px) {
      body { padding: 8px; }
      .clock-date { margin-top: 6px; }
    }
  </style>
</head>
<body>
  <main class="clock" aria-label="北京时间">
    <time class="clock-time" id="clock-time" aria-label="当前北京时间">--:--:--</time>
    <p class="clock-date" id="clock-date"></p>
  </main>
  <script>
    (() => {
      const timeElement = document.getElementById('clock-time');
      const dateElement = document.getElementById('clock-date');
      const formatter = new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Shanghai',
        year: 'numeric', month: 'numeric', day: 'numeric', weekday: 'long',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
      });
      let timer;

      function render() {
        const now = new Date();
        const parts = Object.fromEntries(
          formatter.formatToParts(now).map(part => [part.type, part.value])
        );
        timeElement.textContent = `${parts.hour}:${parts.minute}:${parts.second}`;
        timeElement.dateTime = now.toISOString();
        dateElement.textContent = `${parts.year}年${parts.month}月${parts.day}日${parts.weekday}`;
      }

      function tick() {
        clearTimeout(timer);
        render();
        if (!document.hidden) {
          timer = setTimeout(tick, 1000 - (Date.now() % 1000) + 10);
        }
      }

      document.addEventListener('visibilitychange', tick);
      window.addEventListener('pageshow', tick);
      tick();
    })();
  </script>
</body>
</html>
